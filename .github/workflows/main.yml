name: Build Jarvis Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Offline Vosk Indian English Speech Model
        run: |
          mkdir -p app/src/main/assets
          curl -L https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip -o model.zip
          unzip -q model.zip
          mv vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in
          rm model.zip

      - name: Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
